<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReturnRadar | Neural Risk Engine</title>
    <link rel="icon" type="image/svg+xml" href="./package-box-svgrepo-com.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">

    <style>
        /* --- 1. FONTS & CURSOR --- */
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #050505;
            color: #ffffff;
            cursor: none; /* Hide default cursor */
            overflow-x: hidden;
        }
        .font-radar { font-family: 'Space Grotesk', sans-serif; }

        /* Custom Cursor Elements */
        .cursor-dot, .cursor-outline {
            position: fixed;
            top: 0; left: 0;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            z-index: 9999;
            pointer-events: none;
        }
        .cursor-dot { width: 8px; height: 8px; background-color: #a855f7; }
        .cursor-outline {
            width: 40px; height: 40px;
            border: 1px solid rgba(168, 85, 247, 0.5);
            transition: width 0.2s, height 0.2s, background-color 0.2s;
        }

        /* --- 2. AGGRESSIVE BLOB ANIMATION (Fixed "Not Moving" Issue) --- */
        @keyframes aggressiveMorph {
            0% {
                border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
                transform: translate(0, 0) scale(1);
            }
            33% {
                border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%;
                transform: translate(100px, -50px) scale(1.1);
            }
            66% {
                border-radius: 40% 50% 30% 60%;
                transform: translate(-50px, 50px) scale(0.9);
            }
            100% {
                border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
                transform: translate(0, 0) scale(1);
            }
        }

        .blob {
            position: fixed;
            filter: blur(90px);
            z-index: -1;
            opacity: 0.5;
            animation: aggressiveMorph 12s infinite ease-in-out;
            will-change: transform, border-radius;
        }

        /* --- 3. FLOATING ICONS (Bigger & More Movement) --- */
        @keyframes activeFloat {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-60px) rotate(15deg); } /* Increased movement range */
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .floater {
            position: fixed;
            font-size: 5rem; /* Bigger size as requested */
            opacity: 0.15;
            z-index: -1;
            animation: activeFloat 6s ease-in-out infinite;
            filter: grayscale(100%);
            pointer-events: none;
        }

        /* Card Entry Animation */
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(40px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-card-entry {
            animation: slideUpFade 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0; /* Start hidden */
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="cursor-root"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- COMPONENT: CUSTOM CURSOR ---
        const CustomCursor = () => {
            const dotRef = useRef(null);
            const outlineRef = useRef(null);

            useEffect(() => {
                const moveCursor = (e) => {
                    const { clientX, clientY } = e;
                    if (dotRef.current) {
                        dotRef.current.style.left = `${clientX}px`;
                        dotRef.current.style.top = `${clientY}px`;
                    }
                    if (outlineRef.current) {
                        outlineRef.current.animate({
                            left: `${clientX}px`,
                            top: `${clientY}px`
                        }, { duration: 500, fill: "forwards" });
                    }
                };
                window.addEventListener("mousemove", moveCursor);
                return () => window.removeEventListener("mousemove", moveCursor);
            }, []);

            return (
                <>
                    <div ref={dotRef} className="cursor-dot"></div>
                    <div ref={outlineRef} className="cursor-outline"></div>
                </>
            );
        };

        // --- COMPONENT: RISK CARD ---
        const RiskCard = ({ item, index }) => {
            const riskScore = parseFloat(item.riskProbability || item.risk_probability || 0);
            const severity = item.severity || "Unknown";

            // Dynamic Color Logic
            let colorClass = "text-emerald-400";
            let barColor = "from-emerald-500 to-teal-500";
            let borderColor = "border-emerald-500/30";

            if (severity === "Medium") {
                colorClass = "text-orange-400";
                barColor = "from-orange-500 to-yellow-500";
                borderColor = "border-orange-500/30";
            } else if (severity === "High" || riskScore > 0.7) {
                colorClass = "text-red-400";
                barColor = "from-red-600 to-pink-600";
                borderColor = "border-red-500/30";
            }

            return (
                <div
                    className={`
                        animate-card-entry relative group
                        backdrop-blur-xl bg-white/5
                        border border-white/10 hover:border-white/30
                        p-6 rounded-3xl shadow-2xl
                        transition-all duration-300 hover:-translate-y-2 hover:shadow-purple-900/20
                        flex flex-col h-full min-h-[320px]
                    `}
                    style={{ animationDelay: `${index * 100}ms` }}
                >
                    <div className="flex justify-between items-start mb-4">
                        <span className="text-[10px] font-bold tracking-widest text-purple-300/80 uppercase bg-purple-500/10 px-2 py-1 rounded">
                            {item.brand || "GENERIC"}
                        </span>
                        <span className="text-[10px] font-mono text-gray-500">
                            {item.asin || item.id || "N/A"}
                        </span>
                    </div>

                    <h3 className="text-xl font-medium text-white mb-6 leading-snug group-hover:text-purple-200 transition-colors line-clamp-3">
                        {item.title}
                    </h3>

                    <div className="mt-auto space-y-4">
                        <div>
                            <div className="flex justify-between items-end mb-1">
                                <span className="text-xs text-gray-500 uppercase tracking-wider">Risk Probability</span>
                                <span className={`text-3xl font-bold font-radar ${colorClass}`}>
                                    {(riskScore * 100).toFixed(0)}%
                                </span>
                            </div>
                            <div className="w-full bg-gray-700/50 h-2 rounded-full overflow-hidden">
                                <div
                                    className={`h-full bg-gradient-to-r ${barColor} shadow-[0_0_15px_currentColor] transition-all duration-1000`}
                                    style={{ width: `${Math.min(riskScore * 100, 100)}%` }}
                                ></div>
                            </div>
                        </div>

                        <div className="flex items-center justify-between text-xs pt-4 border-t border-white/5">
                            <div className="flex flex-col">
                                <span className="text-gray-500">Sentiment Velocity</span>
                                <span className="font-mono text-blue-300 text-sm">{item.sentimentVelocity || item.sentiment_velocity || 0}</span>
                            </div>
                            <div className={`px-3 py-1.5 rounded-lg bg-white/5 border ${borderColor} text-gray-300 font-medium`}>
                                {item.primaryDriver || item.dominant_risk_driver || "Pending"}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            const [query, setQuery] = useState("");
            const [category, setCategory] = useState("All Departments");
            const [limit, setLimit] = useState(6);
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(false);
            const [searched, setSearched] = useState(false);

            const API_URL = "https://v3fq04eam7.execute-api.us-east-1.amazonaws.com/search";

            const handleSearch = async () => {
                setLoading(true);
                setSearched(true);
                setData([]);
                try {
                    const response = await fetch(API_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            title: query,
                            category: category,
                            limit: parseInt(limit)
                        })
                    });
                    const result = await response.json();

                    if (result.error || (Array.isArray(result) && result.length === 0)) {
                         setData([]);
                    } else {
                         const items = Array.isArray(result) ? result : [result];
                         setData(items);
                    }
                } catch (error) {
                    console.error("Error:", error);
                }
                setLoading(false);
            };

            return (
                <div className="relative min-h-screen flex flex-col items-center p-4">
                    <CustomCursor />

                    {/* --- BACKGROUND ELEMENTS (More Aggressive) --- */}
                    <div className="fixed inset-0 overflow-hidden pointer-events-none">
                        <div className="blob" style={{ top: '10%', left: '10%', width: '500px', height: '500px', background: '#7e22ce' }}></div>
                        <div className="blob" style={{ bottom: '20%', right: '10%', width: '400px', height: '400px', background: '#2563eb', animationDelay: '-4s' }}></div>
                        <div className="blob" style={{ top: '40%', left: '40%', width: '450px', height: '450px', background: '#be185d', animationDelay: '-8s' }}></div>

                        {/* Floating 3D Icons (Bigger) */}
                        <div className="floater" style={{ top: '15%', left: '5%' }}>🎸</div>
                        <div className="floater" style={{ top: '60%', left: '8%', animationDelay: '2s' }}>👟</div>
                        <div className="floater" style={{ top: '20%', right: '10%', animationDelay: '4s' }}>🎮</div>
                        <div className="floater" style={{ top: '80%', right: '5%', animationDelay: '1s' }}>📦</div>
                        <div className="floater" style={{ top: '40%', right: '40%', animationDelay: '3s' }}>👕</div>
                    </div>

                    {/* --- HEADER --- */}
                    <div className="text-center mb-10 mt-16 relative z-10 group">
                        <h1 className="text-6xl md:text-8xl font-bold mb-4 tracking-tighter">
                            <span className="bg-clip-text text-transparent bg-gradient-to-r from-pink-300 via-purple-300 to-indigo-300">Return</span>
                            <span className="font-radar italic font-light ml-2 text-white/90 group-hover:text-white transition-colors">Radar</span>
                        </h1>
                        <div className="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white/5 border border-white/10 backdrop-blur-md">
                            <span className="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
                            <p className="text-sm text-gray-300 tracking-wide font-mono">
                                TRANSFORMER-DRIVEN SEMANTIC ENGINE
                            </p>
                        </div>
                    </div>

                    {/* --- SEARCH INTERFACE --- */}
                    <div className="w-full max-w-4xl bg-white/5 backdrop-blur-xl border border-white/10 rounded-3xl p-4 shadow-2xl mb-16 relative z-20">
                        <div className="flex flex-col md:flex-row gap-4">

                            <div className="relative min-w-[200px] group">
                                <select
                                    value={category}
                                    onChange={(e) => setCategory(e.target.value)}
                                    className="w-full h-14 bg-black/40 text-white rounded-xl px-4 appearance-none outline-none border border-transparent focus:border-purple-500/50 transition-all cursor-pointer font-radar"
                                >
                                    {/* UPDATED CATEGORIES AS REQUESTED */}
                                    <option>All Departments</option>
                                    <option>Health & Household</option>
                                    <option>Appliances</option>
                                    <option>Fashion</option>
                                    <option>Musical Instruments</option>
                                </select>
                                <div className="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-purple-400">▼</div>
                            </div>

                            <input
                                type="text"
                                placeholder="Search product..."
                                value={query}
                                onChange={(e) => setQuery(e.target.value)}
                                onKeyPress={(e) => e.key === 'Enter' && handleSearch()}
                                className="flex-1 h-14 bg-black/40 text-white rounded-xl px-6 outline-none border border-transparent focus:border-purple-500/50 transition-all placeholder-gray-500 text-lg"
                            />

                            <div className="w-24 relative">
                                <input
                                    type="number"
                                    value={limit}
                                    onChange={(e) => setLimit(e.target.value)}
                                    className="w-full h-14 bg-black/40 text-center text-white rounded-xl outline-none border border-transparent focus:border-purple-500/50 transition-all font-mono text-lg"
                                />
                                <span className="absolute top-1 right-2 text-[10px] text-gray-500">MAX</span>
                            </div>
                        </div>

                        <button
                            onClick={handleSearch}
                            disabled={loading}
                            className="w-full h-16 mt-4 bg-gradient-to-r from-blue-600 via-purple-600 to-pink-600 rounded-2xl font-bold text-xl tracking-wide hover:shadow-lg hover:shadow-purple-500/25 active:scale-[0.99] transition-all relative overflow-hidden disabled:opacity-50 disabled:cursor-not-allowed"
                        >
                            {loading ? "Analyzing Neural Patterns..." : "Run Semantic Analysis"}
                        </button>
                    </div>

                    {/* --- RESULTS GRID --- */}
                    <div className="w-full max-w-7xl px-4 pb-10 relative z-10 flex-grow">
                        {searched && !loading && data.length === 0 && (
                            <div className="text-center mt-10 opacity-60">
                                <p className="text-4xl mb-2">🚫</p>
                                <p className="font-light">No risk patterns detected for this query.</p>
                            </div>
                        )}

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {data.map((item, idx) => (
                                <RiskCard key={idx} item={item} index={idx} />
                            ))}
                        </div>
                    </div>

                    {/* --- NEW FOOTER --- */}
                    <div className="w-full text-center py-10 mt-auto border-t border-white/5 bg-black/20 backdrop-blur-sm z-20">
                        <p className="text-white/60 text-lg font-light tracking-wide mb-1">
                            Get the products you should never buy by just typing what you want to buy 📦
                        </p>
                        <p className="text-white/30 text-sm font-radar uppercase tracking-widest">
                            Group 2 DBDA
                        </p>
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
