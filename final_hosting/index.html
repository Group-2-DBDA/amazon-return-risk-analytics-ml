<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReturnRadar | Neural Risk Engine</title>
    <link rel="icon" type="image/svg+xml" href="./package-box-svgrepo-com.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>

    <style>
        /* --- 1. CORE STYLES --- */
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #030303;
            color: #ffffff;
            cursor: none; /* Custom cursor */
            overflow-x: hidden;
            transition: background-color 3s ease;
        }
        .font-radar { font-family: 'Space Grotesk', sans-serif; }

        /* --- 2. THEME TRANSITIONS --- */
        :root {
            /* Original Screenshot Gradient Colors */
            --color-return-start: #f9a8d4;  /* Pink-300 */
            --color-return-mid: #d8b4fe;    /* Purple-300 */
            --color-return-end: #a5b4fc;    /* Indigo-300 */

            /* Theme variables for the blobs/other elements */
            --theme-primary: #c084fc;
            --theme-secondary: #2563eb;
        }

        /* Create a custom utility for the gradient */
        .text-gradient-return {
            background: linear-gradient(to right,
            var(--color-return-start),
            var(--color-return-mid),
            var(--color-return-end)
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .theme-transition {
            transition: all 3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- 3. CUSTOM CURSOR --- */
        .cursor-dot, .cursor-outline {
            position: fixed;
            top: 0; left: 0;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            z-index: 9999;
            pointer-events: none;
        }
        .cursor-dot { width: 8px; height: 8px; background-color: var(--theme-primary); transition: background-color 3s ease; }
        .cursor-outline {
            width: 40px; height: 40px;
            border: 1px solid var(--theme-primary);
            opacity: 0.5;
            transition: width 0.2s, height 0.2s, border-color 3s ease;
        }

        /* --- 4. BACKGROUND ANIMATIONS --- */
        @keyframes aggressiveMorph {
            0% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; transform: translate(0, 0) scale(1); }
            33% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; transform: translate(100px, -50px) scale(1.1); }
            66% { border-radius: 40% 50% 30% 60%; transform: translate(-50px, 50px) scale(0.9); }
            100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; transform: translate(0, 0) scale(1); }
        }

        .blob {
            position: fixed;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.4;
            animation: aggressiveMorph 15s infinite ease-in-out;
            transition: background-color 3s ease;
        }

        /* --- 5. FLOATING ICONS (PRESERVED) --- */
        @keyframes activeFloat {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-60px) rotate(15deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .floater {
            position: fixed;
            font-size: 5rem;
            opacity: 0.15;
            z-index: -1;
            animation: activeFloat 8s ease-in-out infinite;
            filter: grayscale(100%);
            pointer-events: none;
        }

        /* --- 6. UTILITIES --- */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .card-entry {
            animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- THEME CONSTANTS ---
        const THEMES = {
            // Updated DEFAULT to match your screenshot (Purple/Blue mix)
            DEFAULT: { primary: '#a855f7', secondary: '#3b82f6' },
            SAFE:    { primary: '#10b981', secondary: '#3b82f6' }, // Green/Blue
            MEDIUM:  { primary: '#f59e0b', secondary: '#ef4444' }, // Orange
            HIGH:    { primary: '#f43f5e', secondary: '#9f1239' }  // Red
        };

        // --- HELPER: CSV DOWNLOAD ---
        const downloadCSV = (data) => {
            if (!data || !data.length) return;
            const headers = Object.keys(data[0]);
            const csvContent = [
                headers.join(","),
                ...data.map(row => headers.map(header => `"${String(row[header] || '').replace(/"/g, '""')}"`).join(","))
            ].join("\n");

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", "return_radar_report.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        // --- COMPONENT: CUSTOM CURSOR ---
        const CustomCursor = () => {
            const dotRef = useRef(null);
            const outlineRef = useRef(null);

            useEffect(() => {
                const moveCursor = (e) => {
                    const { clientX, clientY } = e;
                    if (dotRef.current) {
                        dotRef.current.style.left = `${clientX}px`;
                        dotRef.current.style.top = `${clientY}px`;
                    }
                    if (outlineRef.current) {
                        outlineRef.current.animate({ left: `${clientX}px`, top: `${clientY}px` }, { duration: 500, fill: "forwards" });
                    }
                };
                window.addEventListener("mousemove", moveCursor);
                return () => window.removeEventListener("mousemove", moveCursor);
            }, []);

            return (
                <>
                    <div ref={dotRef} className="cursor-dot"></div>
                    <div ref={outlineRef} className="cursor-outline"></div>
                </>
            );
        };

        // --- COMPONENT: SENTIMENT INDICATOR ---
        const SentimentIndicator = ({ value }) => {
            let color = "text-yellow-400";
            let icon = "minus";

            if (value > 0.1) {
                color = "text-emerald-400";
                icon = "arrow-up-right";
            } else if (value < -0.1) {
                color = "text-red-400";
                icon = "arrow-down-right";
            }

            return (
                <div className="flex items-center gap-2 bg-white/5 rounded-lg px-2 py-1">
                    <div className="flex flex-col">
                        <span className="text-[9px] text-gray-500 uppercase tracking-widest">Sentiment</span>
                        <span className={`text-xs font-mono font-bold ${color}`}>{value}</span>
                    </div>
                    <i data-feather={icon} className={`${color} w-4 h-4`}></i>
                </div>
            );
        };

        // --- COMPONENT: PRODUCT CARD ---
        const ProductCard = ({ item, index, isSafe }) => {
            const riskScore = parseFloat(item.riskProbability || item.risk_probability || 0);
            const sentiment = parseFloat(item.sentimentVelocity || item.sentiment_velocity || 0);

            const cleanTitle = (text) => {
                if(!text) return "Unknown Product";
                const words = text.split(' ');
                if(words.length <= 8) return text;
                return words.slice(0, 8).join(' ') + '...';
            };

            const displayTitle = cleanTitle(item.title);

            let accentColor = "text-emerald-400";
            let barGradient = "from-emerald-500 to-teal-500";

            if (riskScore > 0.75) {
                accentColor = "text-red-500";
                barGradient = "from-red-600 to-rose-600";
            } else if (riskScore > 0.40) {
                accentColor = "text-orange-400";
                barGradient = "from-orange-500 to-amber-500";
            }

            useEffect(() => { if(window.feather) feather.replace(); });

            return (
                <div
                    className={`
                        card-entry group relative flex flex-col justify-between
                        glass-panel rounded-2xl p-6
                        transition-all duration-500 hover:bg-white/10 hover:-translate-y-2
                        ${isSafe ? 'border-emerald-500/30 shadow-[0_0_30px_rgba(16,185,129,0.1)]' : 'border-white/10'}
                    `}
                    style={{ animationDelay: `${index * 100}ms` }}
                >
                    <div className="absolute inset-0 bg-[#0a0a0a] z-20 p-6 rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none flex items-center justify-center text-center">
                        <p className="text-sm text-gray-300 font-medium leading-relaxed">
                            {item.title}
                        </p>
                    </div>

                    <div>
                        <div className="flex justify-between items-start mb-4">
                            <span className="text-[10px] font-bold tracking-widest text-gray-500 uppercase bg-white/5 px-2 py-1 rounded">
                                {item.brand || "GENERIC"}
                            </span>

                            {/* RESTORED ASIN HERE */}
                            {isSafe ? (
                                <span className="text-[10px] font-bold text-emerald-950 bg-emerald-400 px-2 py-1 rounded flex items-center gap-1">
                                    <i data-feather="shield" className="w-3 h-3"></i> SAFE
                                </span>
                            ) : (
                                <span className="text-[10px] font-mono text-gray-500">
                                    {item.asin || item.id || ""}
                                </span>
                            )}
                        </div>

                        <h3 className="text-lg font-medium text-gray-100 mb-6 leading-snug font-radar h-14 overflow-hidden">
                            {displayTitle}
                        </h3>
                    </div>

                    <div className="space-y-4">
                        <div>
                            <div className="flex justify-between items-end mb-1">
                                <span className="text-[10px] text-gray-500 uppercase tracking-wider">Risk Probability</span>
                                <span className={`text-2xl font-bold font-radar ${accentColor}`}>
                                    {(riskScore * 100).toFixed(0)}%
                                </span>
                            </div>
                            <div className="w-full bg-gray-800 h-1.5 rounded-full overflow-hidden">
                                {/* SUBTLE GLOW ADDED HERE */}
                                <div
                                    className={`h-full bg-gradient-to-r ${barGradient} transition-all duration-1000 ease-out shadow-[0_0_8px_currentColor]`}
                                    style={{ width: `${Math.min(riskScore * 100, 100)}%` }}
                                ></div>
                            </div>
                        </div>

                        <div className="flex items-center justify-between pt-4 border-t border-white/5">
                            <SentimentIndicator value={sentiment} />

                            <div className="text-right">
                                <p className="text-[9px] text-gray-500 uppercase tracking-widest mb-0.5">Primary Defect</p>
                                <p className="text-xs text-gray-300 font-medium truncate max-w-[120px]">
                                    {item.dominant_risk_driver || "Analysis Pending"}
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- COMPONENT: SAFE ALTERNATIVES DROPDOWN ---
        const SafeAlternatives = ({ items }) => {
            const [isOpen, setIsOpen] = useState(false);
            if (!items || items.length === 0) return null;

            return (
                <div className="w-full max-w-7xl px-4 mb-8 z-20 relative">
                    <button
                        onClick={() => setIsOpen(!isOpen)}
                        className="
                            flex items-center gap-3 px-6 py-3 rounded-full
                            bg-emerald-500/10 border border-emerald-500/20
                            text-emerald-400 hover:bg-emerald-500/20 hover:border-emerald-500/40
                            transition-all duration-300 group mx-auto mb-6
                        "
                    >
                        <i data-feather="shield" className="w-4 h-4"></i>
                        <span className="font-radar font-bold tracking-wide text-sm">
                            {isOpen ? "HIDE SAFE ALTERNATIVES" : "VIEW SAFE ALTERNATIVES"}
                        </span>
                        <i data-feather="chevron-down" className={`w-4 h-4 transition-transform duration-300 ${isOpen ? 'rotate-180' : ''}`}></i>
                    </button>

                    <div className={`grid grid-cols-1 md:grid-cols-3 gap-6 transition-all duration-500 overflow-hidden ${isOpen ? 'max-h-[800px] opacity-100' : 'max-h-0 opacity-0'}`}>
                        {items.map((item, idx) => (
                            <ProductCard key={`safe-${idx}`} item={item} index={idx} isSafe={true} />
                        ))}
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            const [query, setQuery] = useState("");
            const [category, setCategory] = useState("All Departments");
            const [limit, setLimit] = useState(6);
            const [riskyData, setRiskyData] = useState([]);
            const [safeData, setSafeData] = useState([]);
            const [loading, setLoading] = useState(false);
            const [hasSearched, setHasSearched] = useState(false);
            const [theme, setTheme] = useState(THEMES.DEFAULT);

            const API_URL = "https://v3fq04eam7.execute-api.us-east-1.amazonaws.com/search";

            // Update CSS Variables when theme state changes
            useEffect(() => {
                const root = document.documentElement;
                root.style.setProperty('--theme-primary', theme.primary);
                root.style.setProperty('--theme-secondary', theme.secondary);
            }, [theme]);

            const calculateTheme = (riskyItems) => {
                if (!riskyItems || riskyItems.length === 0) return THEMES.DEFAULT;

                const totalRisk = riskyItems.reduce((acc, item) => acc + (parseFloat(item.risk_probability) || 0), 0);
                const avgRisk = totalRisk / riskyItems.length;

                if (avgRisk > 0.70) return THEMES.HIGH;
                if (avgRisk > 0.40) return THEMES.MEDIUM;
                return THEMES.SAFE;
            };

            const handleSearch = async () => {
                setLoading(true);
                setHasSearched(true);
                setRiskyData([]);
                setSafeData([]);

                try {
                    const response = await fetch(API_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            title: query,
                            category: category,
                            limit: parseInt(limit)
                        })
                    });

                    const result = await response.json();

                    const newRisky = result.risky || [];
                    const newSafe = result.safe || [];

                    setRiskyData(newRisky);
                    setSafeData(newSafe);
                    setTheme(calculateTheme(newRisky));

                } catch (error) {
                    console.error("Error:", error);
                }
                setLoading(false);
            };

            return (
                <div className="relative min-h-screen flex flex-col items-center p-4">
                    <CustomCursor />

                    {/* --- DYNAMIC BACKGROUND --- */}
                    <div className="fixed inset-0 overflow-hidden pointer-events-none transition-colors duration-[3000ms]">
                        <div className="blob" style={{ top: '10%', left: '10%', width: '550px', height: '550px', backgroundColor: hasSearched ? theme.primary : '#7e22ce', opacity :0.4}}></div>
                        <div className="blob" style={{ bottom: '20%', right: '10%', width: '400px', height: '400px', backgroundColor: hasSearched ? theme.secondary : '#2563eb', animationDelay: '-4s' }}></div>
                        <div className="blob" style={{ top: '40%', left: '40%', width: '450px', height: '450px', backgroundColor: hasSearched ? theme.primary : '#be185d', animationDelay: '-8s', opacity: 0.5 }}></div>

                        {/* PRESERVED ICONS */}
                        <div className="floater" style={{ top: '15%', left: '5%' }}>🎸</div>
                        <div className="floater" style={{ top: '60%', left: '8%', animationDelay: '2s' }}>👟</div>
                        <div className="floater" style={{ top: '20%', right: '10%', animationDelay: '4s' }}>🎮</div>
                        <div className="floater" style={{ top: '80%', right: '5%', animationDelay: '1s' }}>📦</div>
                        <div className="floater" style={{ top: '40%', right: '40%', animationDelay: '3s' }}>👕</div>
                    </div>

                    {/* --- HEADER --- */}
                    <div className="text-center mb-12 mt-20 relative z-10 group">
                        <h1 className="text-6xl md:text-8xl font-bold mb-4 tracking-tighter transition-colors duration-1000">
                            <span
                                className="font-syne bg-clip-text text-transparent theme-transition"
                                style={{
                                    backgroundImage: `linear-gradient(to right, ${theme.primary}, ${theme.secondary})`
                                }}
                            >
                                Return
                            </span>
                            <span className="font-radar italic font-light ml-2 text-white">Radar</span>
                        </h1>
                        <div className="inline-flex items-center gap-2 px-4 py-2 rounded-full glass-panel">
                            <span className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                            <p className="text-xs text-gray-400 tracking-widest font-mono">
                                TRANSFORMER-DRIVEN SEMANTIC ENGINE
                            </p>
                        </div>
                    </div>

                    {/* --- SEARCH BAR --- */}
                    <div className="w-full max-w-4xl glass-panel rounded-3xl p-4 mb-12 relative z-20">
                        <div className="flex flex-col md:flex-row gap-4">
                            <div className="relative min-w-[200px]">
                                <select
                                    value={category}
                                    onChange={(e) => setCategory(e.target.value)}
                                    className="w-full h-14 bg-black/40 text-white rounded-xl px-4 appearance-none outline-none border border-transparent focus:border-white/20 transition-all font-radar cursor-pointer"
                                >
                                    <option>All Departments</option>
                                    <option>Health & Household</option>
                                    <option>Appliances</option>
                                    <option>Fashion</option>
                                    <option>Musical Instruments</option>
                                </select>
                                <div className="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-gray-500">▼</div>
                            </div>

                            <input
                                type="text"
                                placeholder="Analyze product risk..."
                                value={query}
                                onChange={(e) => setQuery(e.target.value)}
                                onKeyPress={(e) => e.key === 'Enter' && handleSearch()}
                                className="flex-1 h-14 bg-black/40 text-white rounded-xl px-6 outline-none border border-transparent focus:border-white/20 transition-all placeholder-gray-600 text-lg"
                            />

                            <div className="w-24 relative">
                                <input
                                    type="number"
                                    value={limit}
                                    onChange={(e) => setLimit(e.target.value)}
                                    className="w-full h-14 bg-black/40 text-center text-white rounded-xl outline-none border border-transparent focus:border-white/20 transition-all font-mono text-lg"
                                />
                                <span className="absolute top-1 right-2 text-[10px] text-gray-600">MAX</span>
                            </div>
                        </div>

                        <button
                            onClick={handleSearch}
                            disabled={loading}
                            className="
                                w-full h-16 mt-6 rounded-2xl font-bold text-xl tracking-widest
                                /* Glass/Bubble Effect */
                                bg-white/5 backdrop-blur-xl border border-white/10
                                text-white/90 uppercase transition-all duration-500
                                /* Interactive States */
                                hover:bg-white/10 hover:border-white/20 hover:scale-[1.01]
                                active:scale-[0.98] disabled:opacity-30
                                /* Glow Effect */
                                shadow-[0_0_20px_rgba(255,255,255,0.05)]
                            "
                        >
                            {loading ? "Analyzing Neural Patterns..." : "Run Semantic Analysis"}
                        </button>
                    </div>

                    {/* --- SAFE ALTERNATIVES --- */}
                    <SafeAlternatives items={safeData} />

                    {/* --- RESULTS GRID --- */}
                    <div className="w-full max-w-7xl px-4 pb-20 relative z-10 flex-grow">
                        {hasSearched && !loading && riskyData.length === 0 && (
                            <div className="text-center mt-10 opacity-60">
                                <p className="text-4xl mb-2">✨</p>
                                <p className="font-light">No significant risk patterns detected.</p>
                            </div>
                        )}

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {/* FIXED: Added .slice(0, limit) to enforce the display limit visually */}
                            {riskyData.slice(0, limit).map((item, idx) => (
                                <ProductCard key={idx} item={item} index={idx} isSafe={false} />
                            ))}
                        </div>
                    </div>

                    {/* --- REPORT DOWNLOAD FAB --- */}
                    {hasSearched && (riskyData.length > 0 || safeData.length > 0) && (
                        <button
                            onClick={() => downloadCSV([...riskyData, ...safeData])}
                            className="
                                fixed bottom-8 right-8 z-50
                                w-14 h-14 rounded-full glass-panel
                                flex items-center justify-center
                                hover:bg-white hover:text-black transition-all duration-300
                                shadow-2xl group
                            "
                            title="Download Analysis Report"
                        >
                            <i data-feather="download" className="w-6 h-6"></i>
                            <span className="absolute right-16 bg-white text-black text-xs font-bold px-3 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">
                                Download Report
                            </span>
                        </button>
                    )}

                    {/* --- PRESERVED FOOTER --- */}
                    <div className="w-full text-center py-10 mt-auto border-t border-white/5 bg-black/20 backdrop-blur-sm z-20">
                        <p className="text-white/60 text-lg font-light tracking-wide mb-1">
                            Get the products you should never buy by just typing what you want to buy 📦
                        </p>
                        <p className="text-white/30 text-sm font-radar uppercase tracking-widest">
                            Group 2 DBDA
                        </p>
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
