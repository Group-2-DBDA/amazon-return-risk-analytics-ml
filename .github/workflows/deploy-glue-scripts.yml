name: Deploy AWS Glue Scripts to S3

on:
  push:
    branches:
      - main
    paths:
      - "aws_glue_scripts/*.py"

jobs:
  upload-glue-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload ETL on Meta Script
        run: |
          aws s3 cp "aws_glue_scripts/ETL on meta.py" \
          "s3://glue-etl-job-7249/Etl on meta/scripts/ETL on meta.py"

      - name: Upload ETL on Review Script
        run: |
          aws s3 cp "aws_glue_scripts/ETL on reviews common.py" \
          "s3://glue-etl-job-7249/ETL on Review/scripts/ETL on reviews common.py"
